# SamurAI Council - Docker Compose Configuration
#
# Required Environment Variables:
#   OPENAI_API_KEY      - Your OpenAI API key
#   ANTHROPIC_API_KEY   - Your Anthropic API key
#   GOOGLE_API_KEY      - Your Google AI API key (optional)
#   MSSQL_SA_PASSWORD   - SQL Server SA password (default: YourStrong!Passw0rd)
#
# First-time Setup:
#   1. Download ContosoRetailDW.bak from Microsoft Download Center
#   2. Place the .bak file in ./data/contoso/
#   3. Run: docker compose up -d
#
# Usage:
#   docker compose up -d
#   docker compose logs -f web

services:
  web:
    image: samuraicouncil-web
    build:
      context: .
      dockerfile: SamurAICouncil.Web/Dockerfile
    ports:
      - "5080:8080"
    environment:
      # ASP.NET Core settings
      - ASPNETCORE_URLS=http://+:8080

      # Database connections
      - ConnectionStrings__DefaultConnection=Host=db;Database=samuraicouncil;Username=postgres;Password=postgres
      - ConnectionStrings__ContosoDb=Server=sqlserver;Database=ContosoRetailDW;User Id=samurai_reader;Password=Reader!Pass123;TrustServerCertificate=True

      # API Keys / endpoint (from host environment)
      # Routed through the FortyAU LiteLLM gateway (OpenAI-compatible).
      # The "OpenAI" key holds the gateway token; all council roles use the
      # "openai" provider pointed at OpenAIEndpoint below.
      - LlmApiKeys__OpenAI=${OPENAI_API_KEY}
      - LlmApiKeys__OpenAIEndpoint=https://llm.fortyau.com/v1
      - LlmApiKeys__Anthropic=${ANTHROPIC_API_KEY:-}
      - LlmApiKeys__Google=${GOOGLE_API_KEY:-}

      # Council configuration - Council Members (all via gateway)
      # NOTE: Claude models are currently unavailable on the gateway, so the
      # council uses GPT + Gemini for diversity.
      - Council__CouncilModels__0__Provider=openai
      - Council__CouncilModels__0__ModelId=gpt-4o
      - Council__CouncilModels__0__DisplayName=GPT-4o
      - Council__CouncilModels__1__Provider=openai
      - Council__CouncilModels__1__ModelId=gpt-4.1
      - Council__CouncilModels__1__DisplayName=GPT-4.1
      - Council__CouncilModels__2__Provider=openai
      - Council__CouncilModels__2__ModelId=gemini-2.5-flash
      - Council__CouncilModels__2__DisplayName=Gemini 2.5 Flash

      # Council configuration - Chairman (synthesizes final answer)
      - Council__ChairmanModel__Provider=openai
      - Council__ChairmanModel__ModelId=gemini-2.5-pro
      - Council__ChairmanModel__DisplayName=Gemini 2.5 Pro

      # Council configuration - Title generation (lightweight)
      - Council__TitleGenerationModel__Provider=openai
      - Council__TitleGenerationModel__ModelId=gpt-4o-mini
      - Council__TitleGenerationModel__DisplayName=GPT-4o mini

      # Company Data configuration (Text-to-SQL for ContosoRetailDW)
      - CompanyData__ConnectionString=Server=sqlserver;Database=ContosoRetailDW;User Id=samurai_reader;Password=Reader!Pass123;TrustServerCertificate=True
      - CompanyData__MaxRows=100
      - CompanyData__QueryTimeoutSeconds=30
      - CompanyData__SqlGenerationModel__Provider=openai
      - CompanyData__SqlGenerationModel__ModelId=gpt-4o
      - CompanyData__SqlGenerationModel__DisplayName=GPT-4o (SQL)
    depends_on:
      db:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samuraicouncil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      - MSSQL_MEMORY_LIMIT_MB=2048
      - MSSQL_COLLATION=SQL_Latin1_General_CP1_CI_AS
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./data/contoso:/var/opt/mssql/backup:ro
      - ./scripts/sql:/scripts:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  sqlserver_data:

